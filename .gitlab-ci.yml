# Hearth build of this fork: registry.hearth.internal/hearth/paperclip.
#   push to hearth           -> :<short sha>
#   tag v<upstream>-hearth.N -> also :<upstream>-hearth.N (what hearth/infra deploys)
# Upstream's production stage, then hearth/uid.Dockerfile (runs as srv 997:984).
workflow:
  rules:
    - if: $CI_COMMIT_BRANCH == "hearth"
    - if: $CI_COMMIT_TAG =~ /^v.+-hearth\.[0-9]+$/

build:
  image: docker:29.8.2-cli
  tags: [docker, hearth]
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - BASE="$CI_REGISTRY_IMAGE/upstream:$CI_COMMIT_SHORT_SHA"
    - IMG="$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
    - docker build --target production --build-arg PAPERCLIP_BUILD_COMMIT="$CI_COMMIT_SHA" -t "$BASE" .
    - >
      docker build -f hearth/uid.Dockerfile --build-arg BASE="$BASE"
      --label org.opencontainers.image.version="${CI_COMMIT_TAG:-$CI_COMMIT_SHORT_SHA}"
      --label org.opencontainers.image.revision="$CI_COMMIT_SHA"
      --label org.opencontainers.image.created="$(date -u +%FT%TZ)"
      --label org.opencontainers.image.source="$CI_PROJECT_URL"
      -t "$IMG" hearth
    - docker push -q "$IMG"
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        docker tag "$IMG" "$CI_REGISTRY_IMAGE:${CI_COMMIT_TAG#v}"
        docker push -q "$CI_REGISTRY_IMAGE:${CI_COMMIT_TAG#v}"
      fi
    - docker image rm "$BASE" >/dev/null
